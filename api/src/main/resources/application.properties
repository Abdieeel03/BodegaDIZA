spring.application.name=api

# Importar variables de entorno desde archivo .env si existe
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Puerto del Servidor
server.port=${SERVER_PORT:8080}

# Configuración de Conexión a Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bodega_diza}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuración de JWT
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS y usuario inicial de desarrollo
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
app.bootstrap-admin.nombre=${ADMIN_NOMBRE:Administrador Diza}

# Configuración de Correo Electrónico (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Servicio de Machine Learning
ml.service-base-url=${ML_SERVICE_BASE_URL:http://localhost:8001}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
