# Perfil de producción para BodegaDIZA API (Supabase PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}&prepareThreshold=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
diza.demo.enabled=false
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:https://diza.abdieeel.dev}
